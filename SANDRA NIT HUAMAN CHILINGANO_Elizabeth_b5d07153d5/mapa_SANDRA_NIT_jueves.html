    <script>
    (function() {
        var userMarker = null;
        var userCircle = null;
        var firstCenter = true;

        function addOrUpdateUserLocation(lat, lng, accuracy) {
            var latlng = [lat, lng];

            if (!userMarker) {
                userMarker = L.marker(latlng, {
                    title: "Ubicación actual del digitalizador"
                }).addTo(map_139defeaffdd23218bf522d6a001600b);

                userMarker.bindPopup("📍 Ubicación actual del digitalizador");
            } else {
                userMarker.setLatLng(latlng);
            }

            if (!userCircle) {
                userCircle = L.circle(latlng, {
                    radius: accuracy || 30,
                    color: "#ee1c25",
                    fillColor: "#ee1c25",
                    fillOpacity: 0.18,
                    weight: 2
                }).addTo(map_139defeaffdd23218bf522d6a001600b);
            } else {
                userCircle.setLatLng(latlng);
                userCircle.setRadius(accuracy || 30);
            }

            if (firstCenter) {
                map_139defeaffdd23218bf522d6a001600b.setView(latlng, 15);
                firstCenter = false;
            }
        }

        window.addEventListener("message", function(event) {
            if (!event.data || event.data.tipo !== "actualizar-ubicacion") return;

            addOrUpdateUserLocation(
                event.data.lat,
                event.data.lon,
                event.data.accuracy
            );
        });
    })();
