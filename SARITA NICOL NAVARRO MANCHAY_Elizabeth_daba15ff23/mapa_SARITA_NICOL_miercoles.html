            var latlng = [lat, lng];

            if (!userMarker) {
                userMarker = L.marker(latlng, {
                    title: "Ubicación actual del digitalizador"

            } else {
                userMarker.setLatLng(latlng);
            }

            if (!userCircle) {
                userCircle = L.circle(latlng, {
                    radius: accuracy || 30,
                    color: "#ee1c25",
                    fillColor: "#ee1c25",
                    fillOpacity: 0.18,
                    weight: 2
                }).addTo(map_902a490996a3b0ea343c84b6c3867c09);
            } else {
                userCircle.setLatLng(latlng);
                userCircle.setRadius(accuracy || 30);
            }

            if (firstCenter) {
                map_902a490996a3b0ea343c84b6c3867c09.setView(latlng, 15);
                firstCenter = false;
            }
        }

        window.addEventListener("message", function(event) {
            if (!event.data || event.data.tipo !== "actualizar-ubicacion") return;

                event.data.lat,
                event.data.lon,
                event.data.accuracy
            );
        });
    })();
